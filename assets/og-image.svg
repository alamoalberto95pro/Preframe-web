<!--
  Tarjeta de Open Graph (1200×630).

  Master vectorial. El PNG que consumen las meta (`og-image.png`) se genera
  desde aquí con `npm run brand:build` en el repo de la app: rasteriza con el
  Chromium de Electron, así que las fuentes y los degradados salen tal cual.
  No editar el PNG a mano.

  La marca de la esquina es el mismo dibujo que `mark-rim.svg`, incrustado
  aquí en vez de referenciado porque un `<image>` externo no viaja en la
  captura. Si cambia el icono, cambia también este bloque.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0F0F"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#E8814A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8814A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0603A"/>
      <stop offset="0.5" stop-color="#A8845C"/>
      <stop offset="1" stop-color="#5D7FA8"/>
    </linearGradient>

    <!-- Marca. Mismos tokens que brand/src/*.svg, en el espacio 0–100. -->
    <linearGradient id="pf-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#463D35"/><stop offset="0.45" stop-color="#241F1B"/><stop offset="1" stop-color="#0D0B0A"/>
    </linearGradient>
    <linearGradient id="pf-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="56">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pf-cream" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="76">
      <stop offset="0" stop-color="#FFFCF7"/><stop offset="1" stop-color="#E6D3BC"/>
    </linearGradient>
    <linearGradient id="pf-amber" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="86">
      <stop offset="0" stop-color="#FFCE96"/><stop offset="0.5" stop-color="#E08A44"/><stop offset="1" stop-color="#A94E27"/>
    </linearGradient>
    <mask id="pf-knock" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <rect x="9.5" y="53.5" width="27" height="21" rx="6.5" fill="#000000"/>
      <rect x="36.5" y="26.5" width="27" height="21" rx="6.5" fill="#000000"/>
      <rect x="63.5" y="42.5" width="27" height="21" rx="6.5" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Marca: tile a 56px en la esquina + wordmark PreFrame -->
  <g transform="translate(80,66) scale(0.56)">
    <path d="M30,0 L70,0 C85.7,0 91.4,2.1 95,5 C97.9,8.6 100,14.3 100,30 L100,70 C100,85.7 97.9,91.4 95,95 C91.4,97.9 85.7,100 70,100 L30,100 C14.3,100 8.6,97.9 5,95 C2.1,91.4 0,85.7 0,70 L0,30 C0,14.3 2.1,8.6 5,5 C8.6,2.1 14.3,0 30,0 Z" fill="url(#pf-tile)"/>
    <path d="M30,0 L70,0 C85.7,0 91.4,2.1 95,5 C97.9,8.6 100,14.3 100,30 L100,70 C100,85.7 97.9,91.4 95,95 C91.4,97.9 85.7,100 70,100 L30,100 C14.3,100 8.6,97.9 5,95 C2.1,91.4 0,85.7 0,70 L0,30 C0,14.3 2.1,8.6 5,5 C8.6,2.1 14.3,0 30,0 Z" fill="url(#pf-sheen)"/>
    <path d="M30,0 L70,0 C85.7,0 91.4,2.1 95,5 C97.9,8.6 100,14.3 100,30 L100,70 C100,85.7 97.9,91.4 95,95 C91.4,97.9 85.7,100 70,100 L30,100 C14.3,100 8.6,97.9 5,95 C2.1,91.4 0,85.7 0,70 L0,30 C0,14.3 2.1,8.6 5,5 C8.6,2.1 14.3,0 30,0 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.8"/>
    <path d="M6,74 C22,74 22,44 44,44 C66,44 68,60 94,60" fill="none" stroke="url(#pf-cream)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.56" mask="url(#pf-knock)"/>
    <g fill="url(#pf-cream)" opacity="0.58">
      <rect x="11" y="55" width="24" height="18" rx="5"/>
      <rect x="38" y="28" width="24" height="18" rx="5"/>
      <rect x="65" y="44" width="24" height="18" rx="5"/>
    </g>
    <rect x="46" y="14" width="8" height="72" rx="4" fill="url(#pf-amber)"/>
  </g>
  <text x="152" y="110" font-family="Satoshi, Inter, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.68"><tspan fill="#E08A44">Pre</tspan><tspan fill="#F0EDE6">Frame</tspan></text>

  <!-- Titular -->
  <text x="80" y="266" font-family="Satoshi, Inter, sans-serif" font-size="72" font-weight="700" fill="#F5F3EF" letter-spacing="-1.5">Your shot list isn't a list.</text>
  <text x="80" y="348" font-family="Satoshi, Inter, sans-serif" font-size="72" font-weight="700" fill="#E8814A" letter-spacing="-1.5">It's a timeline.</text>

  <text x="80" y="408" font-family="Inter, sans-serif" font-size="25" fill="#C5BFB2">Pre-production for filmmakers who feel the music first</text>

  <!-- Timeline: waveform a la izquierda, curva emocional a la derecha -->
  <g transform="translate(80 470)">
    <g fill="#B85843">
      <rect x="0"   y="42" width="7" height="30" rx="2"/>
      <rect x="12"  y="26" width="7" height="46" rx="2"/>
      <rect x="24"  y="52" width="7" height="20" rx="2"/>
      <rect x="36"  y="14" width="7" height="58" rx="2"/>
      <rect x="48"  y="36" width="7" height="36" rx="2"/>
      <rect x="60"  y="6"  width="7" height="66" rx="2"/>
      <rect x="72"  y="46" width="7" height="26" rx="2"/>
      <rect x="84"  y="22" width="7" height="50" rx="2"/>
    </g>
    <g fill="#C97A4A">
      <rect x="100" y="34" width="7" height="38" rx="2"/>
      <rect x="112" y="10" width="7" height="62" rx="2"/>
      <rect x="124" y="48" width="7" height="24" rx="2"/>
      <rect x="136" y="20" width="7" height="52" rx="2"/>
      <rect x="148" y="40" width="7" height="32" rx="2"/>
      <rect x="160" y="4"  width="7" height="68" rx="2"/>
      <rect x="172" y="44" width="7" height="28" rx="2"/>
      <rect x="184" y="28" width="7" height="44" rx="2"/>
    </g>
    <g fill="#A88547">
      <rect x="200" y="18" width="7" height="54" rx="2"/>
      <rect x="212" y="38" width="7" height="34" rx="2"/>
      <rect x="224" y="8"  width="7" height="64" rx="2"/>
      <rect x="236" y="50" width="7" height="22" rx="2"/>
      <rect x="248" y="24" width="7" height="48" rx="2"/>
      <rect x="260" y="42" width="7" height="30" rx="2"/>
    </g>

    <path d="M 300 62 C 400 62, 420 40, 520 44 C 620 48, 640 6, 740 14 C 840 22, 900 56, 1040 60"
          fill="none" stroke="url(#curve)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="740" cy="14" r="7" fill="#E8814A"/>
  </g>

  <!-- Secciones -->
  <g transform="translate(80 570)">
    <rect x="0"   y="0" width="180" height="3" rx="1.5" fill="#9B3D2E"/>
    <rect x="188" y="0" width="280" height="3" rx="1.5" fill="#B85843"/>
    <rect x="476" y="0" width="220" height="3" rx="1.5" fill="#C97A4A"/>
    <rect x="704" y="0" width="260" height="3" rx="1.5" fill="#A88547"/>
    <rect x="972" y="0" width="148" height="3" rx="1.5" fill="#7A6033"/>
  </g>
</svg>
